name: Cloud Live Photo Worker

on:
  repository_dispatch:
    types: [cloud-live-photo]
  workflow_dispatch:
    inputs:
      job_id:
        description: Supabase Live Photo job id
        required: false
        type: string
      warm_cache:
        description: Prepare the reusable Live Photo runtime without processing a user job
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloud-live-photo-${{ github.event.client_payload.job_id || inputs.job_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      LIVE_PHOTO_JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
      SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
      CLOUD_JOB_SECRET: ${{ secrets.CLOUD_JOB_SECRET }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          # worker 只需要 server.py 和 scripts/，仓库里 docs/screenshots 就有 25MB。
          sparse-checkout: |
            server.py
            scripts
          sparse-checkout-cone-mode: false

      - name: Restore the FFmpeg runtime
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/Cellar/ffmpeg
            /usr/local/Cellar/mpg123
            /usr/local/Cellar/lame
            /usr/local/Cellar/libvpx
            /usr/local/Cellar/opus
            /usr/local/Cellar/sdl3
            /usr/local/Cellar/sdl2-compat
            /usr/local/Cellar/svt-av1
            /usr/local/Cellar/x264
            /usr/local/Cellar/x265
            /usr/local/opt/ffmpeg
            /usr/local/opt/mpg123
            /usr/local/opt/lame
            /usr/local/opt/libvpx
            /usr/local/opt/opus
            /usr/local/opt/sdl3
            /usr/local/opt/sdl2-compat
            /usr/local/opt/svt-av1
            /usr/local/opt/x264
            /usr/local/opt/x265
          key: macos-15-intel-live-photo-ffmpeg-8.1.2-1-v2

      - name: Install FFmpeg on the first cache run
        run: |
          if ! find /usr/local/Cellar/ffmpeg -type f -path '*/bin/ffmpeg' -print -quit | grep -q .; then
            brew install ffmpeg
          fi

      - name: Expose the cached FFmpeg runtime
        run: |
          if [[ ! -e /usr/local/opt/libvpx || ! -e /usr/local/opt/ffmpeg ]]; then
            for formula in mpg123 lame libvpx opus sdl3 sdl2-compat svt-av1 x264 x265 ffmpeg; do
              brew link --overwrite "$formula" >/dev/null
            done
          fi
          FFMPEG_BIN="$(find /usr/local/Cellar/ffmpeg -type f -path '*/bin/ffmpeg' | head -1)"
          test -x "$FFMPEG_BIN"
          echo "$(dirname "$FFMPEG_BIN")" >> "$GITHUB_PATH"
          ffmpeg -version | head -1

      - name: Set up the Python package runner
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/cloud-live-photo.yml

      # makelive 依赖整套 pyobjc，冷装约 12 秒 / 86MB。setup-uv 的缓存会 prune 掉纯 wheel
      # （实测恢复出来只有 455KB），所以这里单独缓存一个装好的 venv，直接跨任务复用。
      - name: Restore the Live Photo packaging runtime
        uses: actions/cache@v4
        with:
          path: ~/.cache/write-then-publish-makelive
          key: macos-15-intel-makelive-0.7.0-py312-v1

      - name: Prepare the Live Photo packaging runtime
        run: |
          VENV="$HOME/.cache/write-then-publish-makelive"
          if [[ ! -x "$VENV/bin/python" ]]; then
            uv venv --python 3.12 "$VENV"
            uv pip install --python "$VENV/bin/python" makelive==0.7.0
          fi
          "$VENV/bin/python" -c "import makelive; print('Live Photo packaging runtime ready')"
          echo "WRITE_THEN_PUBLISH_MAKELIVE_PYTHON=$VENV/bin/python" >> "$GITHUB_ENV"

      - name: Generate and upload the Live Photo package
        if: github.event_name != 'workflow_dispatch' || inputs.warm_cache != true
        run: uv run --no-project --python 3.12 python scripts/cloud_live_photo_worker.py
