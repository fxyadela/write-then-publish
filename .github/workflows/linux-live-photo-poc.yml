name: Cached macOS Live Photo POC

on:
  push:
    branches: [codex/linux-live-photo-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out the app
        uses: actions/checkout@v4

      - name: Restore the FFmpeg runtime
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/Cellar/ffmpeg
            /usr/local/Cellar/mpg123
            /usr/local/Cellar/lame
            /usr/local/Cellar/libvpx
            /usr/local/Cellar/opus
            /usr/local/Cellar/sdl3
            /usr/local/Cellar/sdl2-compat
            /usr/local/Cellar/svt-av1
            /usr/local/Cellar/x264
            /usr/local/Cellar/x265
            /usr/local/opt/ffmpeg
            /usr/local/opt/mpg123
            /usr/local/opt/lame
            /usr/local/opt/libvpx
            /usr/local/opt/opus
            /usr/local/opt/sdl3
            /usr/local/opt/sdl2-compat
            /usr/local/opt/svt-av1
            /usr/local/opt/x264
            /usr/local/opt/x265
          key: macos-15-intel-live-photo-ffmpeg-8.1.2-1-v2
          restore-keys: macos-15-intel-live-photo-ffmpeg-8.1.2-1-v1

      - name: Install FFmpeg on the first cache run
        run: |
          if ! find /usr/local/Cellar/ffmpeg -type f -path '*/bin/ffmpeg' -print -quit | grep -q .; then
            brew install ffmpeg
          fi

      - name: Expose the cached FFmpeg runtime
        run: |
          if [[ ! -e /usr/local/opt/libvpx || ! -e /usr/local/opt/ffmpeg ]]; then
            for formula in mpg123 lame libvpx opus sdl3 sdl2-compat svt-av1 x264 x265 ffmpeg; do
              brew link --overwrite "$formula" >/dev/null
            done
          fi
          FFMPEG_BIN="$(find /usr/local/Cellar/ffmpeg -type f -path '*/bin/ffmpeg' | head -1)"
          test -x "$FFMPEG_BIN"
          echo "$(dirname "$FFMPEG_BIN")" >> "$GITHUB_PATH"

      - name: Set up Python package runner
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/linux-live-photo-poc.yml

      - name: Generate and validate a cached macOS Live Photo package
        run: |
          set -euo pipefail
          mkdir -p live-photo-qa
          cd live-photo-qa
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=1080x1440:rate=30:duration=5" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=5" \
            -c:v libx264 -preset slow -crf 10 -pix_fmt yuv420p \
            -c:a aac -b:a 192k -movflags +faststart Cached-LIVE.MOV
          ffmpeg -hide_banner -loglevel error -y \
            -ss 0.2 -i Cached-LIVE.MOV -frames:v 1 -q:v 2 Cached-LIVE.JPG
          uvx --from makelive==0.7.0 python - <<'PY'
          import json
          from pathlib import Path
          from makelive import is_live_photo_pair, live_id, save_live_photo_pair_as_pvt

          jpg = Path("Cached-LIVE.JPG")
          mov = Path("Cached-LIVE.MOV")
          asset_id, package_path = save_live_photo_pair_as_pvt(jpg, mov)
          package = Path(package_path)
          packaged_jpg = next(path for path in package.iterdir() if path.suffix.lower() in {".jpg", ".jpeg"})
          packaged_mov = next(path for path in package.iterdir() if path.suffix.lower() == ".mov")
          result = {
              "asset_id": asset_id,
              "valid_pair": is_live_photo_pair(packaged_jpg, packaged_mov),
              "jpg_id": live_id(packaged_jpg),
              "mov_id": live_id(packaged_mov),
              "package": package.name,
              "files": sorted(str(path.relative_to(package)) for path in package.rglob("*") if path.is_file()),
          }
          print(json.dumps(result, ensure_ascii=False))
          if not result["valid_pair"] or not package.is_dir() or not result["files"]:
              raise SystemExit("Cached macOS Live Photo validation failed")
          PY
          zip -0 -q -r cached-live-photo-test.zip Cached-LIVE.pvt
          unzip -l cached-live-photo-test.zip

      - name: Upload the phone-test package
        uses: actions/upload-artifact@v4
        with:
          name: cached-live-photo-phone-test
          path: live-photo-qa/cached-live-photo-test.zip
          retention-days: 1
